      #     registry: ${{ env.HARBOR_REGISTRY }}
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          file: ./Dockerfile
          # push: ${{ steps.push.outputs.PUSH_IMAGE == 'true' }}
          push: false # For demo purposes, we set this to false to avoid actually pushing to GHCR. In a real pipeline, you'd use the dynamic value.
          tags: ${{ steps.tag.outputs.IMAGE_FULL }}

      # - name: Set image digest reference
