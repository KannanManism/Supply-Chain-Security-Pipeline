      #     EXPECT_COSIGN_SHA="064954c5d8c7e3b28188eee5b1727b31c411550bc5fefd41aa672d3c761d103a"
          
      #     echo "Downloading Cosign ${COSIGN_VERSION}..."
      #     curl -fsSL --retry 3 -o /tmp/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          
      #     echo "Verifying cryptographic signature..."
