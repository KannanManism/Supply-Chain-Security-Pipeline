  job_4_helm_deploy:
    name: Helm Deploy (Dry Run)
    runs-on: self-hosted
    needs: job_3_build_and_push
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # Zero-Trust bash installation
      - name: Install Helm (Strict Immutability)
        run: |
          set -euo pipefail
          HELM_VERSION="v3.14.0"
          EXPECT_HELM_SHA="f43e1c3387de24547506ab05d24e5309c0ce0b228c23bd8aa64e9ec4b8206651"
          
          curl -fsSL --retry 3 -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${EXPECT_HELM_SHA}  /tmp/helm.tar.gz" | sha256sum -c -
          
          tar -zxvf /tmp/helm.tar.gz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          rm -rf /tmp/helm.tar.gz /tmp/linux-amd64

      # We use 'helm template' to prove the syntax works without needing a real K8s cluster
      - name: Helm Dry Run / Template
        env:
          HELM_NAMESPACE: test-namespace
        run: |
          helm template dnsdb-proxy ./helm/dnsdb-proxy --namespace "$HELM_NAMESPACE"
